{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>Login to AgriVoice AI</h2>
        <p class="auth-subtitle">Access your personalized farming assistant</p>
        <form method="post" class="login-form">
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your 10-digit phone number" required>
            </div>
            <div class="input-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" placeholder="Enter your 4-digit PIN" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <p class="form-link">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
